name: ChatGPT Windows 验证构建

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/components/chatgpt-*"
      - "src/components/codex-*"
      - "src-tauri/src/codex_accounts.rs"
      - "plugins/codex/**"
      - ".github/workflows/chatgpt-windows.yml"

permissions:
  contents: read

concurrency:
  group: chatgpt-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: 安装前端依赖
        run: npm ci
      - name: 前端与插件回归测试
        run: npm test -- --maxWorkers=4
      - name: 打包提供商插件
        run: npm run bundle:plugins
      - name: Windows 凭据解析与 DPAPI 回归测试
        working-directory: src-tauri
        run: |
          cargo test --release --locked --lib codex_accounts::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --lib panel::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --lib codex_account_bridge_is_plugin_scoped
      - name: 构建 Windows 安装包
        run: npm run tauri:build -- --bundles nsis,msi
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: openusage-chatgpt-cliproxy-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
