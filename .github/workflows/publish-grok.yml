# Build OpenUsage Grok (Tauri, Grok-only flavor) on GitHub-hosted Windows.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - push tag grok-v*

name: Publish Grok (Tauri)

on:
  push:
    tags:
      - "grok-v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after build"
        type: boolean
        default: true
      tag_name:
        description: "Release tag (e.g. grok-v0.6.42). Empty = no tag release, artifacts only."
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-grok-windows:
    name: Build OpenUsage Grok Windows
    runs-on: windows-latest
    env:
      VITE_GROK_ONLY: "true"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle plugins
        run: npm run bundle:plugins

      - name: Build Grok flavor (NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GROK_ONLY: "true"
        with:
          projectPath: .
          tagName: ${{ (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.tag_name != '')) && env.RELEASE_TAG || '' }}
          releaseName: ${{ (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.tag_name != '')) && format('OpenUsage Grok {0}', env.RELEASE_TAG) || '' }}
          releaseBody: |
            ## OpenUsage Grok ${{ env.RELEASE_TAG }}

            Tauri 版 · **仅 Grok / SuperGrok** 多账号用量（`VITE_GROK_ONLY`）。

            卡片 UI 与本仓库 Grok 参考布局一致。

            ### 下载

            | 文件 | 说明 |
            |------|------|
            | **NSIS**（`.exe`） | 安装包，推荐 |
            | **MSI**（`.msi`） | 企业 / 静默安装 |

            ### 说明

            - 标识：`com.openusage.grok`
            - 产品名：OpenUsage Grok
            - 数据：`~/.grok/auth.json` + 应用插件 meta

            由 GitHub Actions `windows-latest` 构建（含 MSVC）。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --config src-tauri/tauri.grok.conf.json --bundles nsis,msi

      - name: Pack portable zip (standalone exe + resources)
        shell: pwsh
        run: |
          $rel = "src-tauri/target/release"
          $exe = Get-ChildItem $rel -Filter "*.exe" -File | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw "release exe not found" }
          $portableDir = "dist-portable/OpenUsage-Grok-Tauri-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exe.FullName (Join-Path $portableDir $exe.Name)
          # resources sit next to exe for portable run
          $res = Join-Path $rel "resources"
          if (Test-Path $res) { Copy-Item $res (Join-Path $portableDir "resources") -Recurse -Force }
          # WebView2 is system-provided; document that
          @"
          OpenUsage Grok (Tauri) — 便携目录
          ================================
          双击目录内 OpenUsage Grok.exe（或同名 exe）运行。
          需要系统已安装 WebView2（Win10/11 通常自带）。

          与 NSIS 安装包功能相同；数据目录在 %APPDATA%。
          "@ | Set-Content (Join-Path $portableDir "README-portable.txt") -Encoding UTF8
          Compress-Archive -Path $portableDir -DestinationPath "dist-portable/OpenUsage-Grok-Tauri-portable.zip" -Force
          Get-ChildItem dist-portable | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openusage-grok-tauri-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/OpenUsage-Grok-Tauri-portable.zip
          if-no-files-found: error
          retention-days: 30
